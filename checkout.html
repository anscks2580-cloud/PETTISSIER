<main class="sh-main">
  <div class="wrap">
    <div class="sh-crumb"><a href="cart.html">장바구니</a> › 주문서</div>
    <div class="sh-head"><div><h1>주문서</h1></div></div>
    <div id="co-member"></div>
    <form id="co-form" class="co" novalidate>
      <div>
        <div class="co-box">
          <h2>주문하시는 분</h2>
          <div class="two">
            <div class="fld"><label for="o-name">이름 <em>*</em></label><input id="o-name" name="oname" autocomplete="name" required></div>
            <div class="fld"><label for="o-tel">연락처 <em>*</em></label><input id="o-tel" name="otel" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" required></div>
          </div>
          <div class="fld"><label for="o-mail">이메일</label><input id="o-mail" name="omail" type="email" autocomplete="email" placeholder="결제 영수증을 받을 주소 (선택)"></div>
        </div>
        <div class="co-box">
          <h2>받으시는 분</h2>
          <label class="chk"><input type="checkbox" id="same" checked> 주문하시는 분과 같아요</label>
          <div class="two" id="recv" hidden>
            <div class="fld"><label for="r-name">이름 <em>*</em></label><input id="r-name" name="rname" autocomplete="shipping name"></div>
            <div class="fld"><label for="r-tel">연락처 <em>*</em></label><input id="r-tel" name="rtel" type="tel" inputmode="tel" autocomplete="shipping tel"></div>
          </div>
          <div class="fld" style="margin-top:8px"><label for="zip">주소 <em>*</em></label>
            <div class="row"><input id="zip" name="zip" placeholder="우편번호" readonly required><button type="button" class="btn" id="find-zip">주소 찾기</button></div>
            <input id="addr1" name="addr1" placeholder="기본 주소" readonly required>
            <input id="addr2" name="addr2" placeholder="상세 주소 (동·호수)" autocomplete="address-line2" required>
          </div>
          <div class="fld"><label for="memo">배송 요청사항</label><textarea id="memo" name="memo" placeholder="예) 부재 시 문 앞에 놓아주세요"></textarea></div>
        </div>
        <div class="co-box">
          <h2>결제 방법</h2>
          <div id="pay-area"></div>
        </div>
      </div>
      <div>
        <div class="co-box" style="margin-bottom:18px"><h2>주문 상품</h2><ul class="os-list" id="os-list"></ul></div>

<script>
function summaryHTML(t, cta) {
  const hint = t.short > 0
    ? `<p class="hint warn">최소 주문 금액은 ${Shop.won(SHOP.minOrder)}이에요. <b>${Shop.won(t.short)}</b> 더 담아주세요.</p>`
    : t.toFree > 0 ? `<p class="hint">${Shop.won(t.toFree)} 더 담으면 무료배송이에요.</p>` : `<p class="hint">무료배송이 적용됐어요.</p>`;
  return `<div class="co-box sum"><h2>결제 금액</h2>
    <dl><dt>상품 금액</dt><dd>${Shop.won(t.subtotal)}</dd><dt>배송비</dt><dd>${t.shipping ? Shop.won(t.shipping) : "무료"}</dd>
    <dt class="tot">총 결제 금액</dt><dd class="tot">${Shop.won(t.total)}</dd></dl>${hint}${cta || ""}
    <p class="mini">모든 제품은 주문 확인 후 제작해 최소 ${SHOP.makeDays}일 정도 걸려요.</p></div>`;
}
Shop.ready.then(function () {
  const list = Shop.items(), t = Shop.totals(list);
  if (!list.length || t.short > 0) { location.replace("cart.html"); return; }
  const $ = s => document.querySelector(s);
  const toss = !!SHOP.tossClientKey;
  const label = it => it.p.name + (it.opt ? ` (${it.opt})` : "");
  $("#os-list").innerHTML = list.map(it => `<li><span>${Shop.esc(label(it))} × ${it.qty}</span><b>${Shop.won(it.unit * it.qty)}</b></li>`).join("");
  const agree = `<label class="chk"><input type="checkbox" id="agree" required> 개인정보 수집·이용에 동의해요 <em style="color:var(--wood);font-style:normal">(필수)</em></label>
    <div class="agree-box">수집 항목: 이름, 연락처, 주소, 이메일 · 목적: 주문 상품 제작·배송 및 안내 · 보관 기간: 관련 법령에 따른 기간(전자상거래 계약·결제 기록 5년)</div>`;
  $("#sum-area").innerHTML = summaryHTML(t, agree + `<button type="submit" class="btn fill" id="pay-btn">${toss ? Shop.won(t.total) + " 결제하기" : "주문서 보내기"}</button>`);

  if (toss) {
    $("#pay-area").innerHTML = '<div id="payment-method"></div><div id="agreement"></div>';
    const s = document.createElement("script");
    s.src = "https://js.tosspayments.com/v2/standard";
    s.onload = async () => {
      try {
        const tp = TossPayments(SHOP.tossClientKey);
        window._widgets = tp.widgets({ customerKey: TossPayments.ANONYMOUS });
        await _widgets.setAmount({ currency: "KRW", value: t.total });
        await Promise.all([
          _widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
          _widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" })
        ]);
      } catch (err) { $("#pay-area").innerHTML = '<p class="fld err">결제창을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>'; }
    };
    document.body.appendChild(s);
  } else {
    $("#pay-area").innerHTML = `<div class="paymode"><div class="pm"><b>카카오톡 주문서 → 결제링크</b>
      <p>주문서를 보내주시면 제작 일정을 확인한 뒤 카카오톡으로 결제링크를 보내드려요. 결제가 끝나면 제작을 시작해요.</p></div></div>`;
  }

  // 회원 : 로그인했으면 정보 채우기, 아니면 로그인 안내 (비회원 주문도 가능)
  Auth.ready.then(u => {
    const box = $("#co-member");
    if (u) {
      box.innerHTML = `<div class="co-member"><span><b>${Auth.esc(u.name || u.email)}</b>님으로 주문해요. 주문 내역은 내 정보에서 볼 수 있어요.</span></div>`;
      const fill = (sel, v) => { if (v && !$(sel).value) $(sel).value = v; };
      fill("#o-name", u.name); fill("#o-tel", u.tel); fill("#o-mail", u.email);
      fill("#zip", u.zip); fill("#addr1", u.addr1); fill("#addr2", u.addr2);
    } else {
      box.innerHTML = `<div class="co-member"><span>회원으로 주문하면 주문 내역 확인과 배송지 불러오기가 편해요.</span><span class="sp"></span>
        <a class="btn fill" href="login.html?next=checkout.html">로그인</a><a class="btn" href="signup.html?next=checkout.html">회원가입</a></div>`;
    }
  });

  $("#same").addEventListener("change", e => { $("#recv").hidden = e.target.checked; });
  $("#find-zip").addEventListener("click", () => {
    if (!window.daum || !daum.Postcode) { alert("주소 검색을 불러오는 중이에요. 잠시 후 다시 눌러주세요."); return; }
    new daum.Postcode({ oncomplete: d => { $("#zip").value = d.zonecode; $("#addr1").value = d.roadAddress || d.jibunAddress; $("#addr2").focus(); } }).open();
  });
  $("#zip").addEventListener("click", () => $("#find-zip").click());
  $("#addr1").addEventListener("click", () => $("#find-zip").click());

  const tel = v => v.replace(/[^0-9]/g, "").replace(/^(\d{3})(\d{3,4})(\d{4})$/, "$1-$2-$3");
  function check() {
    const need = [["#o-name", "주문하시는 분 이름"], ["#o-tel", "연락처"], ["#zip", "주소"], ["#addr2", "상세 주소"]];
    if (!$("#same").checked) need.splice(2, 0, ["#r-name", "받으시는 분 이름"], ["#r-tel", "받으시는 분 연락처"]);
    for (const [s, n] of need) if (!$(s).value.trim()) { $(s).focus(); return n + "을(를) 입력해 주세요."; }
    if ($("#o-tel").value.replace(/[^0-9]/g, "").length < 10) { $("#o-tel").focus(); return "연락처를 다시 확인해 주세요."; }
    if (!$("#agree").checked) return "개인정보 수집·이용에 동의해 주세요.";
    return "";
  }
  function orderId() {
    const d = new Date(), z = n => String(n).padStart(2, "0");
    return "PT" + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + z(d.getHours()) + z(d.getMinutes()) + Math.random().toString(36).slice(2, 6).toUpperCase();
  }
  $("#co-form").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = check(); if (msg) { Shop.toast(msg); return; }
    const same = $("#same").checked;
    const order = {
      id: orderId(), at: new Date().toISOString(),
      buyer: { name: $("#o-name").value.trim(), tel: tel($("#o-tel").value), mail: $("#o-mail").value.trim() },
      recv: same ? null : { name: $("#r-name").value.trim(), tel: tel($("#r-tel").value) },
      addr: `(${$("#zip").value}) ${$("#addr1").value} ${$("#addr2").value.trim()}`,
      memo: $("#memo").value.trim(),
      items: list.map(it => ({ id: it.id, name: label(it), price: it.unit, qty: it.qty })),
      subtotal: t.subtotal, shipping: t.shipping, total: t.total
    };
    try { localStorage.setItem("pt-last-order", JSON.stringify(order)); } catch (err) {}
    order.status = toss ? "결제 대기" : "주문서 접수";
    try { await Promise.race([Auth.saveOrder(order), new Promise(r => setTimeout(r, 5000))]); } catch (err) { /* 저장 실패해도 주문은 계속 진행 */ }
    if (!toss) { location.href = "order-done.html?mode=kakao"; return; }
    const first = label(list[0]);
    try {
      await _widgets.requestPayment({
        orderId: order.id,
        orderName: list.length > 1 ? `${first} 외 ${list.length - 1}건` : first,
        successUrl: location.origin + location.pathname.replace(/[^/]*$/, "") + "order-done.html",
        failUrl: location.origin + location.pathname.replace(/[^/]*$/, "") + "order-done.html?fail=1",
        customerName: order.buyer.name,
        customerMobilePhone: order.buyer.tel.replace(/-/g, ""),
        ...(order.buyer.mail ? { customerEmail: order.buyer.mail } : {})
      });
    } catch (err) { if (err && err.code !== "USER_CANCEL") Shop.toast("결제를 진행하지 못했어요. 다시 시도해 주세요."); }
  });
});
</script>
