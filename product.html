</footer>

<div class="floats">
  <a class="fab" data-link="instagram" href="#" target="_blank" rel="noopener" aria-label="인스타그램 바로가기">
    <i class="ic ig"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></i>

<script src="common.js"></script>
<script src="nav-drawer.js"></script>
<script src="firebase-config.js"></script>
<script src="shop-data.js"></script>
<script src="shop.js"></script>
<script src="auth.js"></script>
<script>
Shop.ready.then(function () {
  const root = document.getElementById("pd-root"), E = Shop.esc;
  const p = Shop.byId(new URLSearchParams(location.search).get("id"));
  if (!p) {
    root.innerHTML = '<div class="co-empty"><h1>상품을 찾을 수 없어요</h1><p>판매가 끝났거나 주소가 바뀌었을 수 있어요.</p><a class="btn fill" href="shop.html">전체 상품 보기</a></div>';
    return;
  }
  document.title = p.name + " | 펫티시에";
  const free = SHOP.freeShippingOver, fee = SHOP.shippingFee;
  const opts = p.options && p.options.items && p.options.items.length ? p.options : null;
  const sp = p.spec || {};
  const spec = [["원산지", sp.origin], ["주원료", sp.main], ["특징", sp.feature], ["기능", sp.func], ["급여대상", sp.target]].filter(r => r[1]);
  const details = (p.detail || []).map((src, i) => `<img src="${E(src)}" alt="${E(p.name)} 상세 ${i + 1}" loading="${i < 1 ? "eager" : "lazy"}" decoding="async">`).join("");
  const related = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id && !x.soldout).slice(0, 4);
  const qtyHTML = id => `<div class="qty" data-qty="${id}"><button type="button" data-d="-1" aria-label="수량 빼기">−</button><input type="number" min="1" max="99" value="1" inputmode="numeric" aria-label="수량"><button type="button" data-d="1" aria-label="수량 더하기">+</button></div>`;
  const optHTML = id => opts ? `<select class="opt-sel" data-opt="${id}" aria-label="${E(opts.title || "옵션")} 선택">
      <option value="">${E(opts.title || "옵션")} 선택</option>
      ${opts.items.map(o => `<option value="${E(o.label)}"${o.soldout ? " disabled" : ""}>${E(o.label)}${+o.add ? ` (+${(+o.add).toLocaleString("ko-KR")}원)` : ""}${o.soldout ? " · 품절" : ""}</option>`).join("")}
    </select>` : "";

  root.innerHTML = `
    <div class="sh-crumb"><a href="shop.html">온라인 주문</a> › <a href="shop.html?cat=${p.cat}">${Shop.catLabel(p.cat)}</a></div>
    <div class="pd">
      <div class="pd-photo">${p.soldout ? '<span class="sh-tag">품절</span>' : p.best ? '<span class="sh-tag best">BEST</span>' : ""}<img src="${E(p.thumb)}" alt="${E(p.name)}" width="600" height="600"></div>
      <div class="pd-info">
        <div class="cat">${Shop.catLabel(p.cat)}</div>
        <h1>${E(p.name)}</h1>
        <div class="pd-price">${(+p.price).toLocaleString("ko-KR")}<small>원</small></div>
        ${p.summary ? `<p class="pd-summary">${E(p.summary)}</p>` : ""}
        <dl class="pd-rows">
          <dt>배송비</dt><dd>${Shop.won(fee)} <em>(${Shop.won(free)} 이상 무료배송)</em></dd>
          <dt>제작</dt><dd>주문 확인 후 제작 <em>(최소 ${SHOP.makeDays}일 소요)</em></dd>
          <dt>주문</dt><dd>최소 주문 금액 ${Shop.won(SHOP.minOrder)}</dd>
        </dl>
        <div class="pd-buy">
          ${p.soldout ? '<div class="pd-out">지금은 품절이에요. 재입고 소식은 카카오톡 채널로 알려드려요.</div>' : `
          ${optHTML("main")}
          <div class="pd-sum"><span>${qtyHTML("main")}</span><span>합계 <b id="sum">${Shop.won(p.price)}</b></span></div>
          <div class="pd-btns">
            <button type="button" class="btn" data-act="cart">장바구니</button>
            <button type="button" class="btn fill" data-act="buy">바로 구매</button>
          </div>`}
          <p class="pd-note">펫티시에의 모든 간식은 화학 첨가물·방부제·보존제 없이 천연 재료로 만들어요. 받으신 뒤에는 바로 냉장·냉동 보관해 주세요.</p>
        </div>
      </div>
    </div>

    <nav class="pd-tabs" aria-label="상품 정보 바로가기">
      <a href="#s-detail" class="on">상세정보</a>
      <a href="#s-info">상품정보</a>
      <a href="#s-ship">배송·교환</a>
    </nav>

    <section class="pd-sec" id="s-detail">
      <div class="pd-detail">${details || '<p class="sh-empty">상세 정보를 준비하고 있어요.</p>'}</div>
    </section>

    <section class="pd-sec" id="s-info">
      <h2>상품정보</h2>
      <table class="pd-spec"><tbody>${spec.map(r => `<tr><th scope="row">${r[0]}</th><td>${E(r[1])}</td></tr>`).join("")}<tr><th scope="row">제조</th><td>펫티시에 자체 제작 (안양 평촌)</td></tr></tbody></table>
      <ul class="care" style="padding:0;margin-top:22px">
        <li><i aria-hidden="true">❄</i><div><b>보관 방법</b><p>모든 간식은 천연 재료로만 만들어 상온에서는 변질 우려가 높아요. 냉장·냉동 보관 부탁드려요.</p><small>더 신선하게 드시려면 냉동 보관 후 해동해서 급여하시는 걸 추천해요.</small></div></li>
        <li><i aria-hidden="true">🐾</i><div><b>급여 방법</b><p>급여 전 원재료를 확인해 알레르기 여부를 체크해 주세요. 처음 먹는 간식은 작게 손으로 뜯어 먼저 급여해 보세요. 하루 사료량의 10% 정도만 급여를 권장해요.</p><small>아이의 건강 상태와 몸무게에 따라 조절해 주세요.</small></div></li>
        <li><i aria-hidden="true">♨</i><div><b>해동 후 급여</b><p>차가운 간식을 바로 급여하면 배탈, 구토, 설사 등이 생길 수 있어요. 꼭 찬기가 빠진 뒤 급여해 주세요.</p></div></li>
      </ul>
    </section>

    <section class="pd-sec" id="s-ship">
      <h2>배송·교환·환불</h2>
      <div class="policy">
        <h3>배송</h3>
        <ul>
          <li>배송비 ${Shop.won(fee)}, 상품 합계 ${Shop.won(free)} 이상 무료배송</li>
          <li>모든 제품은 주문 확인 후 제작에 들어가 최소 ${SHOP.makeDays}일 정도 소요돼요.</li>
          <li>최소 주문 금액은 ${Shop.won(SHOP.minOrder)}이에요.</li>
        </ul>
        <h3>교환·환불</h3>
        <ul>
          <li>수제 식품 특성상 제작을 시작한 뒤에는 주문 취소가 어려워요.</li>
          <li>단순 변심에 의한 교환·환불은 어려워요.</li>
          <li>상품이 파손되었거나 잘못 배송된 경우, 받으신 날로부터 7일 이내 사진과 함께 카카오톡 채널로 알려주시면 교환 또는 환불해 드려요.</li>
        </ul>
      </div>
    </section>

    ${related.length ? `<section class="pd-related"><h2>함께 보면 좋은 간식</h2><div class="sh-grid">${related.map(x => `
      <a class="sh-card" href="product.html?id=${encodeURIComponent(x.id)}"><span class="ph"><img src="${E(x.thumb)}" alt="${E(x.name)}" loading="lazy" width="600" height="600"></span><span class="cat">${Shop.catLabel(x.cat)}</span><span class="nm">${E(x.name)}</span><span class="pr">${Shop.won(x.price)}</span></a>`).join("")}</div></section>` : ""}
  `;

  // 모바일 하단 구매바
  const bar = document.getElementById("buybar");
  if (!p.soldout) {
    bar.innerHTML = qtyHTML("bar") + '<button type="button" class="btn" data-act="cart">장바구니</button><button type="button" class="btn fill" data-act="buy">바로 구매</button>';
    bar.hidden = false; document.body.classList.add("has-buybar");
  }

  let qty = 1, opt = "";
  const unit = () => { const o = opts && opts.items.find(x => x.label === opt); return +p.price + ((o && +o.add) || 0); };
  const sync = () => {
    document.querySelectorAll("[data-qty] input").forEach(i => i.value = qty);
    const s = document.getElementById("sum"); if (s) s.textContent = Shop.won(unit() * qty);
  };
  document.addEventListener("click", e => {
    const d = e.target.closest("[data-qty] button");
    if (d) { qty = Math.max(1, Math.min(99, qty + +d.dataset.d)); sync(); return; }
    const a = e.target.closest("[data-act]");
    if (!a) return;
    if (opts && !opt) {
      Shop.toast((opts.title || "옵션") + "을(를) 선택해 주세요.");
      const sel = document.querySelector('[data-opt="main"]'); sel.scrollIntoView({ block: "center", behavior: "smooth" }); sel.focus();
      return;
    }
    Shop.add(p.id, qty, opt || undefined);
    if (a.dataset.act === "buy") location.href = "cart.html";
    else Shop.toast("장바구니에 담았어요.", { href: "cart.html", text: "장바구니 보기" });
  });
  document.addEventListener("change", e => {
    if (e.target.matches("[data-qty] input")) { qty = Math.max(1, Math.min(99, parseInt(e.target.value, 10) || 1)); sync(); }
    if (e.target.matches("[data-opt]")) { opt = e.target.value; sync(); }
  });

  // 탭 표시
  const links = [...document.querySelectorAll(".pd-tabs a")];
  const secs = links.map(l => document.querySelector(l.getAttribute("href")));
  addEventListener("scroll", () => {
    let k = 0; secs.forEach((s, i) => { if (s.getBoundingClientRect().top < 180) k = i; });
    links.forEach((l, i) => l.classList.toggle("on", i === k));
  }, { passive: true });
});
</script>
</body>
</html>
