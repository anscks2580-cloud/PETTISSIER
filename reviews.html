<script>
// 네이버 플레이스 '이런 점이 좋았어요' 키워드 (실제 수치로 교체)
const KEYWORDS = [
  { label: "아이가 잘 먹어요", count: 128 },
  { label: "케이크가 아이를 쏙 닮았어요", count: 97 },
  { label: "재료가 믿음직해요", count: 74 },
  { label: "상담이 친절해요", count: 61 },
  { label: "포장이 꼼꼼해요", count: 45 }
];

// 네이버 방문자 리뷰 (실제 리뷰 문구로 교체)
const REVIEWS = [
  { text: "사진 한 장 보내드렸는데 표정까지 똑같이 만들어 주셨어요. 생일상에 올리자마자 가족 모두 감탄했습니다.", name: "초코맘", date: "26.9", chips: ["생일 케이크", "재방문"] },
  { text: "입이 짧은 아이인데 건조간식은 봉지 소리만 나도 달려와요. 재료가 단순해서 안심하고 줍니다.", name: "두부누나", date: "26.9", chips: ["건조간식"] },
  { text: "알러지가 있어서 걱정했는데 재료를 하나하나 바꿔서 만들어 주셨어요. 세심하게 상담해 주셔서 감사해요.", name: "보리네", date: "26.8", chips: ["맞춤 상담"] },
  { text: "열 살 생일이라 특별하게 해주고 싶었는데 기대 이상이었어요. 먹기 아까워서 한참 사진만 찍었네요.", name: "몽이아빠", date: "26.8", chips: ["피규어 케이크"] },
  { text: "택배로 받았는데 아이스팩까지 꼼꼼하게 챙겨 주셨어요. 다음 달에도 주문할게요.", name: "코코", date: "26.7", chips: ["택배", "포장"] },
  { text: "매장이 밝고 깨끗해서 좋았어요. 오늘 만든 간식이라 그런지 향부터 달라요.", name: "라떼언니", date: "26.6", chips: ["매장 방문"] }
];

const max = Math.max(...KEYWORDS.map(k => k.count));
document.getElementById("keywords").innerHTML = KEYWORDS.map(k =>
  `<li><b style="width:${(k.count / max * 100).toFixed(0)}%"></b><span>“${k.label}”</span><span>${k.count}</span></li>`).join("");

document.getElementById("reviewList").innerHTML = REVIEWS.map(r =>
  `<article class="review"><q>${r.text}</q><div class="chips">${r.chips.map(c => `<em>${c}</em>`).join("")}</div><div class="who"><span>${r.name}</span><span>${r.date} 방문</span></div></article>`).join("");
</script>
