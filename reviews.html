<script>
// 네이버 플레이스 '이런 점이 좋았어요' 키워드 (실제 수치로 교체)
const KEYWORDS = [
  { label: "아이가 잘 먹어요", count: 128 },
  { label: "케이크가 아이를 쏙 닮았어요", count: 97 },
  { label: "재료가 믿음직해요", count: 74 },
  { label: "상담이 친절해요", count: 61 },
  { label: "포장이 꼼꼼해요", count: 45 }
];

// 네이버 실제 리뷰 캡처본
// reviews 폴더에 캡처 이미지를 넣고 아래에 한 줄씩 추가하면 돼요.
// cat 은 "수제 케이크" · "수제간식" · "건조간식" 중 하나로 적어 주세요.
const REVIEWS = [
  { img: "reviews/rv-01.jpg", cat: "수제간식", alt: "리본 토핑을 올린 수제간식 후기, 별점 5점" },
  { img: "reviews/rv-02.jpg", cat: "수제간식", alt: "사료 토핑용 링 간식 재구매 후기, 별점 5점" },
  { img: "reviews/rv-03.jpg", cat: "수제간식", alt: "밥꾸미기 간식 후기, 별점 5점" },
  { img: "reviews/rv-04.jpg", cat: "건조간식", alt: "선물용 건조간식 묶음 후기, 별점 5점" }
];

const max = Math.max(...KEYWORDS.map(k => k.count));
document.getElementById("keywords").innerHTML = KEYWORDS.map(k =>
  `<li><b style="width:${(k.count / max * 100).toFixed(0)}%"></b><span>“${k.label}”</span><span>${k.count}</span></li>`).join("");

document.getElementById("reviewList").innerHTML = REVIEWS.map(r =>
  `<figure class="review-shot"><img src="${r.img}" alt="${r.alt}" loading="lazy" width="1200" height="620"><figcaption><em>${r.cat}</em><span class="stars" aria-hidden="true">★★★★★</span></figcaption></figure>`).join("");
</script>
