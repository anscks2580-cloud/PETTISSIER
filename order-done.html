<script>
(function () {
  const root = document.getElementById("done-root"), q = new URLSearchParams(location.search);
  let o = null; try { o = JSON.parse(localStorage.getItem("pt-last-order")); } catch (e) {}
  if (q.get("fail")) {
    root.innerHTML = `<div class="mark">!</div><h1>결제가 완료되지 않았어요</h1><p>${q.get("message") || "결제가 취소되었거나 오류가 있었어요."}</p><div class="btns"><a class="btn fill" href="checkout.html">다시 시도하기</a><a class="btn" href="cart.html">장바구니로</a></div>`;
    return;
  }
  if (!o) { root.innerHTML = '<h1>주문 정보가 없어요</h1><p>이미 처리된 주문이거나 다른 기기에서 주문하셨을 수 있어요.</p><div class="btns"><a class="btn fill" href="shop.html">온라인 주문으로</a></div>'; return; }
  const lines = [
    "[펫티시에 주문서]",
    "주문번호: " + o.id,
    "",
    ...o.items.map(i => `· ${i.name} × ${i.qty}  ${(i.price * i.qty).toLocaleString("ko-KR")}원`),
    "",
    "상품 금액: " + o.subtotal.toLocaleString("ko-KR") + "원",
    "배송비: " + (o.shipping ? o.shipping.toLocaleString("ko-KR") + "원" : "무료"),
    "총 금액: " + o.total.toLocaleString("ko-KR") + "원",
    "",
    "주문자: " + o.buyer.name + " / " + o.buyer.tel,
    ...(o.recv ? ["받는 분: " + o.recv.name + " / " + o.recv.tel] : []),
    "주소: " + o.addr,
    ...(o.memo ? ["요청사항: " + o.memo] : [])
  ].join("\n");
  if (q.get("mode") === "kakao") {
    root.innerHTML = `<div class="mark">✓</div><h1>주문서가 만들어졌어요</h1>
      <p>아래 주문서를 복사해서 카카오톡 채널로 보내주세요.<br>제작 일정을 확인한 뒤 결제링크를 보내드려요.</p>
      <pre id="sheet">${Shop.esc(lines)}</pre>
      <div class="btns"><button type="button" class="btn" id="copy">주문서 복사</button><a class="btn kakao" id="kakao" href="${SHOP.kakaoChat}" target="_blank" rel="noopener">카카오톡으로 보내기</a></div>
      <p style="font-size:14px;margin-top:18px">카카오톡으로 보내기를 누르면 주문서가 자동으로 복사돼요. 채팅창에 붙여넣기만 하면 돼요.</p>`;
    const copy = async () => { try { await navigator.clipboard.writeText(lines); Shop.toast("주문서를 복사했어요."); return true; } catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("sheet")); getSelection().removeAllRanges(); getSelection().addRange(r); Shop.toast("주문서를 선택했어요. 복사해 주세요."); return false; } };
    document.getElementById("copy").onclick = copy;
    document.getElementById("kakao").addEventListener("click", () => { copy(); Shop.clear(); });
    return;
  }
  // 토스페이먼츠 결제 후 돌아온 경우
  const paymentKey = q.get("paymentKey"), amount = +q.get("amount"), orderId = q.get("orderId");
  if (!paymentKey || orderId !== o.id || amount !== o.total) {
    root.innerHTML = '<div class="mark">!</div><h1>결제 정보를 확인할 수 없어요</h1><p>금액이나 주문번호가 맞지 않아요. 카카오톡 채널로 문의해 주세요.</p>'; return;
  }
  root.innerHTML = '<div class="mark">…</div><h1>결제를 확인하고 있어요</h1><p>잠시만 기다려 주세요.</p>';
  const ok = () => { Shop.clear(); root.innerHTML = `<div class="mark">✓</div><h1>주문이 완료됐어요</h1><p>주문번호 ${o.id}<br>제작 일정은 카카오톡이나 문자로 안내해 드려요.</p><pre>${lines.replace(/</g, "&lt;")}</pre><div class="btns"><a class="btn fill" href="shop.html">계속 둘러보기</a></div>`; };
  if (!SHOP.confirmUrl) {
    root.innerHTML = '<div class="mark">!</div><h1>테스트 결제가 끝났어요</h1><p>결제 승인 서버가 아직 연결되지 않아 실제 결제는 이뤄지지 않았어요.</p><pre>' + lines.replace(/</g, "&lt;") + '</pre>';
    return;
  }
  fetch(SHOP.confirmUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ paymentKey, orderId, amount, order: o }) })
    .then(r => r.ok ? ok() : r.json().then(j => Promise.reject(j)))
    .catch(j => { root.innerHTML = `<div class="mark">!</div><h1>결제 승인에 실패했어요</h1><p>${(j && j.message) || "잠시 후 다시 시도하거나 카카오톡 채널로 문의해 주세요."}</p>`; });
})();
</script>
