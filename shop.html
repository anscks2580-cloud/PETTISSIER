<script>
(function () {
  const grid = document.getElementById("grid"), tabs = document.getElementById("tabs"), sort = document.getElementById("sort");
  const q = new URLSearchParams(location.search);
  let cat = CATEGORIES.some(c => c.key === q.get("cat")) ? q.get("cat") : "all";
  document.getElementById("perks").innerHTML =
    `<li>${Shop.won(SHOP.freeShippingOver)} 이상 무료배송</li><li>주문 후 제작</li><li>최소 주문 ${Shop.won(SHOP.minOrder)}</li>`;
  tabs.innerHTML = CATEGORIES.map(c => `<button type="button" data-cat="${c.key}">${c.label}</button>`).join("");
  window.cardHTML = function (p) {
    const E = Shop.esc;
    const tag = p.soldout ? '<span class="sh-tag">품절</span>' : (p.best ? '<span class="sh-tag best">BEST</span>' : "");
    return `<div class="sh-card${p.soldout ? " out" : ""}">
      <a href="product.html?id=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit">
        <span class="ph">${tag}<img src="${E(p.thumb)}" alt="${E(p.name)}" loading="lazy" width="600" height="600"></span>
        <span class="cat">${Shop.catLabel(p.cat)}</span>
        <span class="nm">${E(p.name)}</span>
        <span class="pr">${p.soldout ? "품절" : Shop.won(p.price)}</span>
      </a>
      ${p.options && p.options.items && p.options.items.length
        ? `<a class="add" href="product.html?id=${encodeURIComponent(p.id)}"${p.soldout ? ' style="display:none"' : ""}>옵션 선택</a>`
        : `<button type="button" class="add" data-add="${E(p.id)}"${p.soldout ? " disabled" : ""}>${p.soldout ? "재입고 예정" : "장바구니 담기"}</button>`}
    </div>`;
  };
  function render() {
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === cat));
    let list = PRODUCTS.filter(p => cat === "all" ? true : cat === "best" ? p.best || p.rank <= 12 : p.cat === cat);
    const s = sort.value;
    list = list.slice().sort((a, b) => (a.soldout - b.soldout) || (s === "low" ? a.price - b.price : s === "high" ? b.price - a.price : a.rank - b.rank));
    document.getElementById("count").textContent = `상품 ${list.length}개`;
    grid.innerHTML = list.length ? list.map(cardHTML).join("") : '<p class="sh-empty">준비 중인 상품이에요.</p>';
  }
  tabs.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    cat = b.dataset.cat;
    history.replaceState(null, "", cat === "all" ? "shop.html" : "shop.html?cat=" + cat);
    render();
  });
  sort.addEventListener("change", render);
  grid.innerHTML = '<p class="sh-empty">상품을 불러오는 중이에요…</p>';
  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-add]"); if (!b) return;
    Shop.add(b.dataset.add, 1);
    Shop.toast("장바구니에 담았어요.", { href: "cart.html", text: "장바구니 보기" });
  });
  Shop.ready.then(render);
})();
</script>
