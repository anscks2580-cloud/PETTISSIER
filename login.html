<script>
const $ = s => document.querySelector(s);
if (Auth.mode === "demo" && $("#au-demo")) $("#au-demo").hidden = false;
document.querySelectorAll("[data-sns]").forEach(b => b.onclick = () => { try { Auth.social(b.dataset.sns); } catch (e) { Shop.toast(e.message); } });
function busy(btn, on, text) { btn.disabled = on; if (text) btn.textContent = text; }
function postcode(zip, a1, a2) {
  if (!window.daum || !daum.Postcode) { Shop.toast("주소 검색을 불러오는 중이에요. 잠시 후 다시 눌러주세요."); return; }
  new daum.Postcode({ oncomplete: d => { $(zip).value = d.zonecode; $(a1).value = d.roadAddress || d.jibunAddress; $(a2).focus(); } }).open();
}

const nextUrl = Auth.next("shop.html");
$("#to-signup").href = "signup.html?next=" + encodeURIComponent(nextUrl);
Auth.ready.then(u => { if (u) location.replace(nextUrl); });
$("#lf").addEventListener("submit", async e => {
  e.preventDefault();
  const le = $("#le"), lb = $("#lb"); le.textContent = "";
  if (!$("#lid").value.trim() || !$("#pw").value) { le.textContent = "아이디와 비밀번호를 입력해 주세요."; return; }
  busy(lb, true, "로그인 중…");
  try { await Auth.signIn($("#lid").value, $("#pw").value); location.replace(nextUrl); }
  catch (err) { le.textContent = Auth.message(err); busy(lb, false, "로그인"); }
});
</script>
