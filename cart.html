<script>
function summaryHTML(t, cta) {
  const hint = t.short > 0
    ? `<p class="hint warn">최소 주문 금액은 ${Shop.won(SHOP.minOrder)}이에요. <b>${Shop.won(t.short)}</b> 더 담아주세요.</p>`
    : t.toFree > 0 ? `<p class="hint">${Shop.won(t.toFree)} 더 담으면 무료배송이에요.</p>` : `<p class="hint">무료배송이 적용됐어요.</p>`;
  return `<div class="co-box sum"><h2>결제 금액</h2>
    <dl><dt>상품 금액</dt><dd>${Shop.won(t.subtotal)}</dd><dt>배송비</dt><dd>${t.shipping ? Shop.won(t.shipping) : "무료"}</dd>
    <dt class="tot">총 결제 금액</dt><dd class="tot">${Shop.won(t.total)}</dd></dl>${hint}${cta || ""}
    <p class="mini">모든 제품은 주문 확인 후 제작해 최소 ${SHOP.makeDays}일 정도 걸려요.</p></div>`;
}
(function () {
  const root = document.getElementById("cart-root");
  function render() {
    const list = Shop.items(), t = Shop.totals(list);
    if (!list.length) {
      root.innerHTML = '<div class="co-empty"><p>장바구니가 비어 있어요.</p><a class="btn fill" href="shop.html">간식 보러 가기</a></div>';
      return;
    }
    root.innerHTML = `<div class="co"><div class="co-box"><h2>담은 상품 ${list.length}개</h2>${list.map(it => `
      <div class="ci">
        <a href="product.html?id=${encodeURIComponent(it.id)}"><img src="${Shop.esc(it.p.thumb)}" alt="" loading="lazy"></a>
        <div><a class="nm" href="product.html?id=${encodeURIComponent(it.id)}">${Shop.esc(it.p.name)}</a>${it.opt ? `<div class="pr">${Shop.esc((it.p.options.title || "옵션") + ": " + it.opt)}</div>` : ""}<div class="pr">${Shop.won(it.unit)}</div>
          <div class="qty" data-id="${Shop.esc(it.key)}"><button type="button" data-d="-1" aria-label="수량 빼기">−</button><input type="number" min="1" max="99" value="${it.qty}" aria-label="수량"><button type="button" data-d="1" aria-label="수량 더하기">+</button></div></div>
        <div class="line"><b>${Shop.won(it.unit * it.qty)}</b><button type="button" class="del" data-del="${Shop.esc(it.key)}">삭제</button></div>
      </div>`).join("")}
      <p style="margin:18px 0 0"><a class="btn sm" href="shop.html">계속 쇼핑하기</a></p></div>
      ${summaryHTML(t, `<a class="btn fill" href="checkout.html"${t.short > 0 ? ' aria-disabled="true"' : ""}>주문하기</a>`)}</div>`;
  }
  root.addEventListener("click", e => {
    const d = e.target.closest(".qty button");
    if (d) { const box = d.closest(".qty"), cur = +box.querySelector("input").value; Shop.setQty(box.dataset.id, cur + +d.dataset.d); render(); return; }
    const del = e.target.closest("[data-del]");
    if (del) { Shop.remove(del.dataset.del); render(); }
  });
  root.addEventListener("change", e => {
    if (e.target.matches(".qty input")) { Shop.setQty(e.target.closest(".qty").dataset.id, parseInt(e.target.value, 10) || 1); render(); }
  });
  Shop.ready.then(render);
})();
</script>
